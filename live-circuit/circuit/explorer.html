<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capability Explorer · SFX Live Circuit Platform</title>
<link rel="icon" href="/circuit/assets/sfx-emblem.png">
<link rel="stylesheet" href="/circuit/site.css">
<link rel="stylesheet" href="/circuit/circuit-canvas.css">
<link rel="stylesheet" href="/circuit/run-evidence.css">
<style>
  /* Explorer workspace: tree, capability header and tabs, the database circuit,
     the selected section, the context panel and a status bar. Every label,
     count, state and badge is a returned navigation row. */
  :root { --observation: #72D7EE; --violet: #A98AF2; --tree: 300px; --context: 380px; --splitter: 8px; }
  body { min-height: 100vh; display: flex; flex-direction: column; }
  .workspace { flex: 1; display: grid; grid-template-columns: var(--tree) var(--splitter) minmax(0, 1fr) var(--splitter) var(--context); min-height: 0; }
  /* Declared region mounts. Each region keeps its declared structure, slots,
     digests and boundary figure; the Explorer's established pane chrome is the
     visual reference, so the region's generic slot frames, minimum heights,
     gaps, pane padding and widths yield to it. Visible slots are transparent
     (display: contents) so the shell's own elements lay out as they always
     have; hidden tab panels stay hidden. */
  #region-header > .region, #tree > .region, #context > .region, #region-middle > .region {
    width: 100%; min-width: 0; min-height: 0; box-sizing: border-box; gap: 0; border: 0; border-radius: 0; background: none; overflow: visible; }
  #tree > .region, #context > .region, #region-middle > .region { display: block; padding: 0; }
  #region-header .region-slot:not([hidden]), #tree .region-slot:not([hidden]), #context .region-slot:not([hidden]),
  #region-middle .region-slot:not([hidden]) { display: contents; }
  #region-header { position: sticky; top: 0; z-index: 10; }
  #region-header a[aria-current="page"] { color: var(--cyan); }
  #region-header > .region { display: flex; align-items: center; gap: 28px; height: 65px; padding: 0 var(--gutter);
    background: var(--bar); border-bottom: 1px solid rgba(41,67,91,.6); backdrop-filter: blur(6px); }
  #tree, #context { min-width: 0; background: rgba(3, 14, 25, .7); padding: 14px 12px; overflow: auto;
    max-height: calc(100vh - 64px - 34px); position: sticky; top: 64px; }
  #region-middle { min-width: 0; overflow: hidden; }
  #region-middle > .region { padding: 18px var(--gutter) 28px; }
  /* The objective, run controls, canvas and timing slots read as the one
     circuit panel they always formed. */
  #region-middle .region-slot[data-slot="objective-composer"], #region-middle .region-slot[data-slot="run-bar"],
  #region-middle .region-slot[data-slot="circuit-scene"], #region-middle .region-slot[data-slot="invocation-timeline"] {
    display: block; min-height: 0; background: var(--panel); border: 1px solid var(--line); border-top: 0; border-bottom: 0; border-radius: 0; padding: 0 12px; }
  #region-middle .region-slot[data-slot="objective-composer"] { border-top: 1px solid var(--line); border-radius: var(--radius) var(--radius) 0 0; padding-top: 12px; }
  #region-middle .region-slot[data-slot="invocation-timeline"] { border-bottom: 1px solid var(--line); border-radius: 0 0 var(--radius) var(--radius); padding-bottom: 12px; margin-bottom: 16px; }
  /* The status bar spans the page bottom, as it did outside the workspace. */
  #region-middle .status-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; }
  body { padding-bottom: 34px; }
  /* Each pane owns its grid column, so a collapsed (display: none) pane never
     shifts the middle into a 0 column or the context into the 1fr column. */
  #tree { grid-column: 1; } #resizer-tree { grid-column: 2; } #region-middle { grid-column: 3; }
  #resizer-context { grid-column: 4; } #context { grid-column: 5; }
  .splitter { position: relative; cursor: col-resize; touch-action: none; background: none; border: 0; padding: 0; }
  .splitter::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; transform: translateX(-50%); background: var(--line); }
  .splitter:hover::before, .splitter:focus-visible::before, .splitter.active::before { width: 2px; background: var(--cyan); }
  .splitter:focus-visible { outline: 2px solid var(--cyan); outline-offset: -2px; }
  body.pane-resizing, body.pane-resizing * { cursor: col-resize !important; user-select: none; }
  .workspace.expanded { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
  .workspace.expanded #tree, .workspace.expanded #context, .workspace.expanded .splitter { display: none; }
  .tree-summary { color: var(--dim); font-size: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
  .picker { display: flex; gap: 6px; margin-bottom: 14px; }
  .picker input { flex: 1; min-width: 0; font: 14px Arial, sans-serif; padding: 8px 10px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; }
  .tree-coordinate { margin: 12px 0 4px; color: var(--cyan); font-size: 12px; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; }
  .tree-group { margin: 6px 0 2px 6px; color: var(--dim); font-size: 12px; }
  .tree-item { display: flex; align-items: center; gap: 6px; width: 100%; text-align: left; padding: 5px 8px; margin: 1px 0; border: 1px solid transparent;
    border-radius: 5px; background: none; color: var(--white); font: 14px Arial, sans-serif; cursor: pointer; }
  .tree-item:hover { background: rgba(69, 167, 255, .08); }
  .tree-item[aria-current="true"] { background: rgba(114, 215, 238, .14); border-color: rgba(114, 215, 238, .5); }
  .tree-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .count { color: var(--muted); font-size: 12px; }
  .badge { font-size: 11px; font-weight: bold; padding: 0 6px; border-radius: 9px; line-height: 17px; }
  .badge.refuse { background: rgba(255, 95, 112, .2); color: var(--red); }
  .badge.warn { background: rgba(246, 185, 77, .18); color: var(--amber); }
  .chip { font-size: 10px; letter-spacing: .04em; color: var(--dim); border: 1px solid var(--line); border-radius: 9px; padding: 0 6px; }
  details.tree-more summary { cursor: pointer; color: var(--dim); font-size: 12px; margin: 4px 0 2px 6px; }
  .crumbs { color: var(--dim); font-size: 13px; margin: 0 0 6px; }
  .cap-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px 18px; }
  .cap-head h1 { font-size: clamp(22px, 2.2vw, 30px); margin: 0; overflow-wrap: anywhere; }
  .meta { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 6px 0 12px; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-left: auto; }
  .actions .button { min-height: 34px; padding: 0 14px; font-size: 13px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; border-bottom: 1px solid var(--line); margin: 6px 0 14px; }
  .tab { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--muted); font: 14px Arial, sans-serif; padding: 9px 12px; cursor: pointer; display: flex; gap: 6px; align-items: center; }
  .tab[aria-selected="true"] { color: var(--white); border-bottom-color: var(--cyan); }
  .scenario-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .scenario-bar select, .page-bar select { font: 13px Arial, sans-serif; padding: 6px 8px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
  .circuit-panel { padding: 12px; margin-bottom: 16px; }
  .page-bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 13px; margin-bottom: 8px; }
  #viewer { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #050f1b; border-radius: 6px; overflow: hidden; }
  #empty { border: 1px dashed var(--line); border-radius: 6px; padding: 28px; color: var(--dim); text-align: center; }
  .section-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; margin: 4px 0 8px; }
  .section-head h2 { font-size: 20px; margin: 0; }
  .note { color: var(--dim); font-size: 12px; margin: 0 0 10px; }
  .notice { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; color: var(--muted); margin: 10px 0; }
  .notice.error { border-color: rgba(255, 95, 112, .6); color: var(--white); }
  .notice.error strong { color: var(--red); }
  .table-wrap { overflow: auto; max-height: 60vh; border: 1px solid var(--line); border-radius: 8px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid rgba(41, 67, 91, .6); vertical-align: top; }
  th { position: sticky; top: 0; background: var(--panel-solid); color: var(--muted); font-weight: normal; white-space: nowrap; }
  td { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  tbody tr { cursor: pointer; } tbody tr:hover { background: rgba(69, 167, 255, .07); }
  tbody tr[aria-selected="true"] { background: rgba(114, 215, 238, .14); }
  .fields { display: grid; grid-template-columns: minmax(120px, max-content) 1fr; gap: 4px 14px; font-size: 13px; margin: 0 0 12px; }
  .fields dt { color: var(--dim); overflow-wrap: anywhere; } .fields dd { margin: 0; overflow-wrap: anywhere; white-space: pre-wrap; }
  .record { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  #context h3 { font-size: 13px; color: var(--cyan); letter-spacing: .06em; text-transform: uppercase; margin: 4px 0 10px; }
  .status-bar { position: sticky; bottom: 0; background: var(--bar); border-top: 1px solid rgba(41,67,91,.6); color: var(--dim); font-size: 12px;
    display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 8px var(--gutter); }
  .status-bar .warn { color: var(--amber); } .status-bar .error { color: var(--red); }
  .drawer-toggle { display: inline-flex; }
  @media (min-width: 1151px) {
    .workspace.tree-collapsed { grid-template-columns: 0 0 minmax(0, 1fr) var(--splitter) var(--context); }
    .workspace.tree-collapsed #resizer-tree { display: none; }
    .workspace.context-collapsed { grid-template-columns: var(--tree) var(--splitter) minmax(0, 1fr) 0 0; }
    .workspace.context-collapsed #resizer-context { display: none; }
    .workspace.tree-collapsed.context-collapsed { grid-template-columns: 0 0 minmax(0, 1fr) 0 0; }
    .workspace.tree-collapsed #tree, .workspace.context-collapsed #context { display: none; }
  }
  @media (max-width: 1150px) {
    .workspace { grid-template-columns: minmax(0, 1fr); }
    #region-middle { grid-column: 1; }
    .splitter { display: none; }
    #tree, #context { position: fixed; top: 64px; bottom: 34px; width: min(88vw, 360px); z-index: 20; max-height: none; display: none; }
    #tree { left: 0; border-right: 1px solid var(--line); } #context { right: 0; border-left: 1px solid var(--line); }
    #tree.open, #context.open { display: flex; box-shadow: 0 0 40px rgba(0,0,0,.6); }
  }
  /* Run bar, run evidence and component drill-down (circuit-runtime.js). */
  .run-bar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 6px; font-size: 13px; color: var(--muted); }
  .run-bar .mode { font-weight: bold; font-size: 12px; letter-spacing: .04em; margin-right: auto; }
  .mode.live { color: var(--cyan); } .mode.replay { color: var(--amber); }
  .run-bar button, .detail-bar button { font: 13px Arial, sans-serif; padding: 6px 10px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .run-bar button:hover:not(:disabled), .detail-bar button:hover { border-color: var(--cyan); }
  .run-bar button:disabled { opacity: .45; cursor: default; }
  .run-bar select, .detail-bar select { font: 13px Arial, sans-serif; padding: 6px 8px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
  .check { display: inline-flex; align-items: center; gap: 5px; }
  .run-lines { font-size: 12px; color: var(--dim); margin: 2px 0 8px; display: grid; gap: 2px; overflow-wrap: anywhere; }
  .detail-bar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
  .legend { font-size: 12px; color: var(--dim); margin-top: 8px; line-height: 1.6; }
  .run-evidence { margin: 0 0 16px; padding: 10px 14px; }
  .run-evidence > summary { cursor: pointer; color: var(--cyan); font-size: 13px; font-weight: bold; }
  .evidence-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; font-size: 13px; }
  .evidence-grid h3 { font-size: 13px; color: var(--cyan); margin: 0 0 8px; }
  .muted { color: var(--dim); } .warning { color: var(--amber); } .error { color: var(--red); } .observation { color: var(--cyan); }
  pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 12px/1.5 Consolas, monospace; max-height: 360px; overflow: auto; }
  summary { cursor: pointer; } #context summary, .evidence-grid summary { color: var(--blue); padding: 4px 0; font-size: 13px; }
  .related-links { display: flex; gap: 6px 14px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
  .authority-children { margin-left: 12px; border-left: 1px solid var(--line); padding-left: 10px; }
  .authority-value { font: 12px/1.6 Consolas, monospace; overflow-wrap: anywhere; padding: 2px 0; }
  #declaration-detail, #inspector { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; font-size: 13px; overflow-wrap: anywhere; }
  #declaration-detail h2 { font-size: 15px; margin: 0 0 6px; }
  /* Observe panel: declared input fields write the JSON that is submitted. */
  .side-section { border-bottom: 1px solid var(--line); padding-bottom: 12px; margin-bottom: 12px; }
  .side-section > summary { color: var(--cyan); font-size: 12px; font-weight: bold; letter-spacing: .06em; text-transform: uppercase; padding: 4px 0 8px; }
  .input-fields { display: grid; gap: 10px; margin: 8px 0; }
  .input-fields.stale::before { content: 'The JSON below is not valid; the fields show its last valid values.'; color: var(--amber); font-size: 12px; }
  .input-field { display: grid; gap: 4px; font-size: 13px; }
  .input-field .field-name { color: var(--white); } .input-field .required { color: var(--amber); } .input-field .fixed { color: var(--dim); }
  .input-field small { color: var(--dim); font-size: 11px; overflow-wrap: anywhere; }
  .input-field input:not([type=checkbox]), .input-field select, .input-field textarea, #payload {
    width: 100%; font: 13px Arial, sans-serif; padding: 7px 9px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; }
  .input-field textarea, #payload { font: 12px/1.45 Consolas, monospace; resize: vertical; }
  .input-field code { color: var(--muted); font-size: 12px; overflow-wrap: anywhere; }
  .input-field .invalid { border-color: var(--amber); }
  #payload { min-height: 92px; }
  .json-label { display: block; color: var(--dim); font-size: 12px; margin: 10px 0 4px; }
  /* Objective row: the universal capability's composer, above the run bar. */
  .objective-panel { margin: 0 0 10px; }
  .objective-row { display: flex; gap: 8px; align-items: flex-start; padding: 8px 10px; background: rgba(8, 26, 43, .92); border: 1px solid var(--line); border-radius: 8px; }
  .objective-field { flex: 1; min-width: 0; display: grid; gap: 2px; }
  #objective-input { width: 100%; min-height: 34px; max-height: 140px; resize: vertical; border: 0; background: transparent; color: var(--white); font: 14px/1.5 Arial, sans-serif; padding: 4px 0 0; }
  #objective-input:focus-visible { outline: 0; }
  .objective-field .voice-status { min-height: 16px; color: var(--dim); font-size: 11px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .objective-field .voice-status.listening { color: var(--observation); }
  .objective-mic { height: 34px; width: 38px; display: inline-flex; align-items: center; justify-content: center; flex: none; background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; color: var(--white); cursor: pointer; }
  .objective-mic:hover:not(:disabled) { border-color: var(--observation); }
  .objective-mic .objective-mic-icon { width: 20px; height: 20px; display: block; fill: currentColor; }
  .objective-mic.listening { color: var(--bg); background: var(--observation); border-color: var(--observation); }
  .objective-mic:disabled { opacity: .45; cursor: default; }
  .objective-run { min-width: 66px; height: 34px; }
  .objective-status { color: var(--muted); font-size: 12px; margin: 4px 0 0; overflow-wrap: anywhere; }
  .objective-status.error { color: var(--red); }
  .summary-strip { display: flex; gap: 10px; align-items: center; margin-top: 6px; padding: 6px 10px; background: rgba(8, 26, 43, .92); border: 1px solid var(--line); border-radius: 8px; }
  .summary-strip[hidden] { display: none; }
  .summary-player { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .summary-player .summary-label { color: var(--violet); font-size: 13px; }
  .summary-player .summary-note { color: var(--dim); font-size: 12px; }
  .summary-rate { font: 12px Arial, sans-serif; padding: 4px 6px; color: var(--white); background: var(--panel-solid); border: 1px solid var(--line); border-radius: 6px; }
  .requested-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-top: 10px; }
  .requested-strip[hidden] { display: none; }
  .requested-chip { border: 1px solid var(--line); border-radius: 9px; padding: 2px 10px; font-size: 12px; color: var(--white); background: rgba(8, 26, 43, .9); }
  .requested-chip[data-state="running"] { border-color: var(--observation); color: var(--observation); }
  .requested-chip[data-state="completed"] { border-color: var(--green); color: var(--green); }
  .requested-chip[data-state="failed"] { border-color: var(--red); color: var(--red); }
  .requested-chip[data-state="not-observable"] { border-style: dashed; border-color: var(--amber); color: var(--amber); }
  .observe-actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0 6px; }
  #observe-status { font-size: 12px; overflow-wrap: anywhere; margin: 6px 0; }
  @media (max-width: 1150px) { .evidence-grid { grid-template-columns: 1fr; } }
  /* View and zoom. Linear: the reader's end caps stay pinned and its bands scroll between them. */
  .view-controls { display: inline-flex; gap: 6px; align-items: center; }
  .view-controls[hidden] { display: none; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; } .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; margin-left: -1px; }
  .seg button[aria-pressed="true"] { background: var(--cyan); color: var(--bg); border-color: var(--cyan); font-weight: bold; }
  .circuit-frame.linear { display: flex; align-items: flex-start; background: #050f1b; border-radius: 6px; overflow: hidden; }
  .cap { position: relative; overflow: hidden; flex: none; z-index: 2; }
  #cap-left { box-shadow: 6px 0 10px -4px rgba(0, 0, 0, .55); } #cap-right { box-shadow: -6px 0 10px -4px rgba(0, 0, 0, .55); }
  .viewer-copy { position: absolute; top: 0; }
  .circuit-frame.linear #band { flex: 1 1 auto; min-width: 0; overflow-x: auto; overflow-y: hidden; }
  .circuit-frame.linear #band-inner { position: relative; overflow: hidden; }
  .circuit-frame.linear #viewer { position: absolute; top: 0; aspect-ratio: auto; border-radius: 0; }
</style>
</head>
<body>
<div id="region-header" data-region="header"></div>
<div class="workspace" id="workspace">
  <div id="tree" data-region="left-sidebar"></div>
  <div class="splitter" id="resizer-tree" role="separator" aria-orientation="vertical" aria-label="Resize capability sections" aria-controls="tree" aria-valuemin="220" aria-valuemax="640" aria-valuenow="300" tabindex="0"></div>
  <div id="region-middle" data-region="middle"></div>
  <div class="splitter" id="resizer-context" role="separator" aria-orientation="vertical" aria-label="Resize run details" aria-controls="context" aria-valuemin="300" aria-valuemax="760" aria-valuenow="380" tabindex="0"></div>
  <div id="context" data-region="right-sidebar"></div>
</div>
<div id="region-footer" data-region="footer"></div>
<script type="module" src="/circuit/explorer.js"></script>
</body>
</html>
