<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="same-origin">
<title>SFX Live Circuit Platform</title>
<meta name="description" content="Watch declared capabilities execute live: input, operations, provider calls and outcome as their receipts arrive.">
<link rel="icon" href="/circuit/assets/sfx-emblem.png">
<link rel="stylesheet" href="/circuit/site.css">
<style>
  .hero { padding: 72px 0 40px; }
  .hero .hero-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 56px; align-items: center; }
  .actions { display: flex; gap: 16px; flex-wrap: wrap; }
  .counts { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 52px; padding: 22px 0; }
  .count { padding: 0 26px; border-left: 1px solid var(--line); } .count:first-child { border-left: 0; }
  .count .value { font-size: clamp(30px, 3vw, 42px); font-weight: bold; line-height: 1.1; }
  .count .label { color: var(--muted); font-size: 17px; } .count .sub { color: var(--dim); font-size: 13px; }
  .snapshot { color: var(--dim); font-size: 12px; margin: 10px 0 0; }
  .signed-panels { display: grid; grid-template-columns: 2fr 5fr; gap: 18px; margin-top: 52px; }
  .signed-panels .panel { padding: 20px 24px; }
  .signed-panels .big { font-size: 26px; font-weight: bold; margin: 8px 0 4px; overflow-wrap: anywhere; }
  .signed-panels .sub { color: var(--muted); font-size: 14px; margin: 0; }
  .runs { list-style: none; padding: 0; margin: 10px 0 0; display: grid; gap: 6px; }
  .runs li { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; color: var(--muted); border-top: 1px solid rgba(41,67,91,.6); padding-top: 6px; }
  .runs li strong { color: var(--white); font-weight: normal; }
  .lower { padding: 64px 0 72px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin: 28px 0 64px; }
  .step { padding: 24px 26px 28px; background: rgba(8,26,43,.92); }
  .step h3 { display: flex; gap: 18px; align-items: baseline; font-size: 24px; margin: 0 0 14px; }
  .step h3 span { font-size: 22px; }
  .step p { color: var(--muted); font-size: 17px; margin: 0; }
  .cards-head { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; }
  .cards-head small { color: var(--amber); font-size: 12px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-top: 22px; }
  .card { display: flex; flex-direction: column; padding: 20px 20px 18px; background: rgba(7,23,37,.96); min-height: 250px; }
  .card h3 { font-size: 21px; margin: 0 0 12px; }
  .card .body { color: var(--muted); font-size: 16px; margin: 0 0 14px; }
  .card .promise { color: var(--cyan); font-size: 14px; margin: 0; }
  .card .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: auto; padding-top: 18px; font-size: 13px; color: var(--dim); }
  .card .meta a { font-size: 15px; font-weight: bold; }
  .card.missing { border-style: dashed; }
  @media (max-width: 1100px) { .cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) {
    .hero { padding: 36px 0 28px; }
    .hero .hero-grid { grid-template-columns: 1fr; gap: 28px; }
    .counts { grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 0; background: none; border: 0; }
    .count { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); padding: 14px 16px; }
    .signed-panels, .steps { grid-template-columns: 1fr; }
    .actions .button { width: 100%; }
  }
  @media (max-width: 560px) { .cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/circuit/home" aria-label="SFX Live Circuit Platform home"><img src="/circuit/assets/sfx-logo-wordmark.png" alt="SFX"><span class="divider"></span><span class="label">Live Circuit Platform</span></a>
    <nav class="site-nav" aria-label="Primary"><a href="/circuit/explorer">Explorer</a><a href="#how">How it works</a></nav>
    <div class="site-actions"><span class="env" id="env" hidden></span><span id="identity"></span></div>
  </div>
</header>

<main id="page-root"></main>

<div id="region-footer" data-region="footer"></div>
<script type="module" src="/circuit/home.js"></script>
</body>
</html>
