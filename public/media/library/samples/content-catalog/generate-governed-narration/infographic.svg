<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='1500' viewBox='0 0 1200 1500'><rect width='1200' height='1500' fill='#061019'/><style>text{font-family:'Segoe UI',sans-serif;fill:#f3f0e8}.m{fill:#9badb9}.c{fill:#6edfdc}.box{fill:#0d1d28;stroke:#25404d;stroke-width:2}.route{stroke:#6edfdc;stroke-width:6;fill:none}</style><text x='80' y='90' class='c' font-size='24' letter-spacing='8'>SIDEFX / CAPABILITY INFOGRAPHIC</text><text x='80' y='190' font-size='70' font-weight='700'>The provider changed.</text><text x='80' y='270' font-size='70' font-weight='700'>The story stayed hers.</text><text x='80' y='330' class='m' font-size='27'>A producer has a script and a ready cut, but cannot continue the edit without usable narration.</text><rect class='box' x='80' y='420' width='1040' height='210' rx='24'/><text x='125' y='480' class='c' font-size='23'>INPUT / HUMAN INTENT</text><text x='125' y='545' font-size='38'>Marked script + waiting edit</text><text x='125' y='590' class='m' font-size='24'>Exact request digest retained</text><path class='route' d='M600 630 V710'/><rect class='box' x='80' y='710' width='1040' height='330' rx='24'/><text x='125' y='775' class='c' font-size='23'>EVENT / PROVIDER CONTINUITY</text><text x='135' y='860' font-size='42' fill='#ed8776'>A</text><text x='200' y='860' class='m' font-size='26'>UNAVAILABLE · SIMULATED</text><text x='135' y='930' font-size='42' fill='#edbc77'>B</text><text x='200' y='930' class='m' font-size='26'>INELIGIBLE · TEXT ONLY</text><text x='135' y='1000' class='c' font-size='42'>C</text><text x='200' y='1000' font-size='26'>SELECTED · LIVE AUDIO</text><path class='route' d='M600 1040 V1120'/><rect class='box' x='80' y='1120' width='1040' height='250' rx='24'/><text x='125' y='1180' class='c' font-size='23'>OUTCOME / PLAYABLE EVIDENCE</text><text x='125' y='1250' font-size='38'>8.21s WAV · hash verified</text><text x='125' y='1305' class='m' font-size='24'>One local job completes. The producer returns to her cut.</text><text x='80' y='1450' class='m' font-size='20'>Observed local demo + editorial staging. See evidence story for claim boundaries.</text></svg>