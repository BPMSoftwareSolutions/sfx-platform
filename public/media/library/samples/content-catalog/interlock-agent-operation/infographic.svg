<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#080f19"/><style>text{font-family:Segoe UI,Arial;fill:#f6f1e9}.c{fill:#73ded5}.t{fill:#b6a4ff}.g{fill:#efbe77}.m{fill:#aabaca}</style><text x="70" y="76" class="t" font-size="21">THE FUTURE OF AGENTIC ENGINEERING / EPISODE 01</text><text x="70" y="153" font-size="51" font-weight="700">Ready to act. Who decides?</text><rect x="70" y="215" width="1060" height="180" rx="15" fill="#111d2b" stroke="#73ded5" stroke-width="3"/><text x="100" y="260" class="c" font-size="21">CURRENT / SOLID EVIDENCE</text><text x="100" y="310" font-size="29">Request → stored decision → ALLOW or OPERATOR_REQUIRED</text><text x="100" y="355" class="m" font-size="22">Decision semantics exist. Live interception is not established here.</text><path d="M600 397 V445 M600 480 V525" stroke="#efbe77" stroke-width="4"/><text x="625" y="468" class="g" font-size="22">Missing pre-effect enforcement</text><rect x="70" y="525" width="1060" height="360" rx="15" fill="#151b30" stroke="#b6a4ff" stroke-width="3" stroke-dasharray="12 8"/><text x="100" y="575" class="t" font-size="21">TARGET / INTENDED EXPERIENCE</text><text x="100" y="632" font-size="28">Attempted effect → interlock → exact authority + mechanic</text><text x="100" y="692" class="t" font-size="26">PERMIT → admitted execution → effect testimony</text><text x="100" y="749" font-size="24">OPERATOR_REQUIRED → authenticated human decision</text><text x="100" y="805" font-size="24">DENY / RESOLVE / HOLD → reason + next legal action</text><text x="100" y="855" class="m" font-size="20">Reference design. No live effects are performed by this simulation.</text><text x="70" y="967" class="g" font-size="23">FUTURE CLOSURE</text><text x="70" y="1016" font-size="25">Same-session deny + permit probes. Exact path coverage.</text><text x="70" y="1063" font-size="25">Protected operator control. Decision-to-effect receipts.</text><text x="70" y="1140" class="t" font-size="24">The work should continue. Authority should stay hers.</text></svg>