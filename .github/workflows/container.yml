name: Website container (build and test only)

on:
  push:
    branches: [main, 'codex/azure-container-deployment']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  container:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # The media publication is restored from SQL rather than committed, so this job needs the
    # environment that holds the connection string.
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.20.0'
      # The database repository owns the media schema and the only SQL client.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: BPMSoftwareSolutions/sidefx-database
          path: .sidefx-database
      - name: Install the database client
        run: npm ci --omit=dev
        working-directory: .sidefx-database
      - name: Restore the media publication from SQL
        env:
          SIDEFX_CONNECTION_STRING: ${{ secrets.SIDEFX_CONNECTION_STRING }}
        run: npm run restore:media
      - name: Build and check the final Linux image
        run: docker build --platform linux/amd64 --build-arg SOURCE_COMMIT="$GITHUB_SHA" -t sidefx-tested:ci .
      - name: Exercise the runtime, staging indexing, readiness failures and restart
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          docker image inspect sidefx-tested:ci --format '{{.Id}}' > artifacts/image-id.txt
          test "$(docker image inspect sidefx-tested:ci --format '{{.Config.User}}')" = node
          docker run -d --name sidefx-smoke -p 127.0.0.1:3000:3000 -e SIDEFX_INDEXING=disabled sidefx-tested:ci
          node scripts/smoke-container.mjs http://127.0.0.1:3000 --noindex --revision "$GITHUB_SHA" | tee artifacts/smoke.txt
          docker exec sidefx-smoke node -e "const fs=require('node:fs'); for(const p of ['.env','.git','scripts','tests']) if(fs.existsSync(p)) process.exit(1)"
          docker exec sidefx-smoke node -e "require('node:fs').renameSync('generated/circuit-projections.json','generated/circuit-projections.hidden')"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/readyz)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/healthz)" = 200
          docker exec sidefx-smoke node -e "require('node:fs').renameSync('generated/circuit-projections.hidden','generated/circuit-projections.json')"
          docker restart --time 15 sidefx-smoke
          node scripts/smoke-container.mjs http://127.0.0.1:3000 --noindex --revision "$GITHUB_SHA" | tee artifacts/restart-smoke.txt
          docker stop --time 15 sidefx-smoke
          test "$(docker inspect sidefx-smoke --format '{{.State.ExitCode}}')" != 137
          docker logs sidefx-smoke > artifacts/container.log 2>&1
          cp generated/publication-manifest.json artifacts/
          sha256sum package-lock.json > artifacts/dependency-lock.sha256
          printf '%s\n' "$GITHUB_SHA" > artifacts/source-commit.txt
          docker save sidefx-tested:ci | gzip > artifacts/image.tar.gz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-container
          path: artifacts/
          retention-days: 14
      - name: Failure logs
        if: failure()
        run: docker logs sidefx-smoke || true

  # The website-only `staging` deployment job was removed on 2026-10-05. It bound a
  # website-only image to sidefx/staging, which hosts the composite Live Circuit
  # (gateway, circuit/observer, SDA Run API, retrieval, identity and installed
  # kernel); a successful run would have replaced that host. Composite circuit
  # releases now deploy automatically through staging.yml; see
  # docs/automatic-staging-deployment.md. The repository variable
  # AZURE_STAGING_ENABLED was also set to false. This build-and-test job retires
  # with the Next.js website: see docs/live-circuit-platform-revamp.md.
