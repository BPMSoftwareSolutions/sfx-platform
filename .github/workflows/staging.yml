name: Live Circuit staging

on:
  push:
    branches: [main]
    paths:
      - 'live-circuit/**'
      - 'deploy/sda-kernel/**'
      - 'deploy/staging/**'
      - 'tools/live-circuit/**'
      - 'tools/sfx-api/**'
      - 'infra/azure.json'
      - 'infra/authorize-staging-release.ps1'
      - '.github/workflows/staging.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Keep the complete release, including Windows acceptance and rollback, exclusive.
concurrency:
  group: live-circuit-staging-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - run: node --test deploy/staging/policy.test.mjs
      - run: node deploy/sda-kernel/verify-composite-package.mjs
      - run: node live-circuit/circuit/verify-identity-session.mjs
      - run: node live-circuit/circuit/verify-run-api.mjs
      - run: node live-circuit/circuit/verify-objective.mjs
      - run: node live-circuit/circuit/verify-provider-profile.mjs
      - run: node live-circuit/circuit/verify-view.mjs
      - run: node live-circuit/circuit/verify-pages.mjs --fixtures
      - run: node live-circuit/circuit/verify-components.mjs
      - run: node live-circuit/circuit/verify-claims.mjs --fixtures
      - run: node tools/live-circuit/verify-kind-tooling.mjs
      - run: node live-circuit/dispatch-pair/verify-run-scoped-sse.mjs
      - run: node deploy/sda-kernel/verify-observer-bridge.mjs

  deploy:
    needs: checks
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    environment:
      name: staging
      url: https://sidefx-staging-fyfhb9gubneqbpaz.eastus2-01.azurewebsites.net/circuit/home
    permissions:
      contents: read
      id-token: write
    env:
      SFX_BROWSER_TEST_MODULE: ${{ github.workspace }}/deploy/staging/test-tools/node_modules/playwright/index.mjs
      SFX_VERIFY_LOGS: '1'
      SFX_LOG_RESOURCE_GROUP: sidefx_group
      SFX_LOG_APP: sidefx
      SFX_LOG_SLOT: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install pinned acceptance browser
        run: |
          npm ci --prefix deploy/staging/test-tools
          deploy/staging/test-tools/node_modules/.bin/playwright install --with-deps chromium
      - name: Check missing-run and retry controls before deployment
        run: node live-circuit/circuit/verify-run-evidence-browser.mjs artifacts/staging/missing-run
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BPMSoftwareSolutions/sfx-providers
          ref: a020024c513eee4f2a8f84939af284f84727d911
          path: .release-sources/sfx-providers
          sparse-checkout: providers
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BPMSoftwareSolutions/sfx-dal
          ref: bcaae40c2447bd9454b6eea9e3e001f0fc61b25b
          path: .release-sources/sfx-dal
          sparse-checkout: identity
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.408'
      - name: Publish the pinned identity evidence transport
        run: node deploy/staging/build-identity.mjs
      - name: Package, build, lock and deploy one composite image
        run: node deploy/staging/release.mjs deploy
      - name: Public reads and authorization boundaries
        run: node deploy/staging/accept.mjs public
      - name: Real sign-in, live Observe, declared-home captures, sign-out and captured replay
        run: node deploy/staging/accept.mjs browser
      - name: Upload the declared-home browser captures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-browser-captures
          path: artifacts/staging/browser-captures/
          retention-days: 30
          if-no-files-found: error
      - name: Prove a new process and unchanged persistent vault
        run: node deploy/staging/release.mjs restart-check
      - name: Reopen the same retained run after the confirmed restart
        run: node deploy/staging/accept.mjs durable
      - name: Real API CLI call and live external follow after restart
        run: node deploy/staging/accept.mjs external
      - name: Retain release state and acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-release
          path: artifacts/staging/
          retention-days: 30
          if-no-files-found: ignore

  windows-cli:
    needs: deploy
    runs-on: windows-2022
    timeout-minutes: 20
    environment: staging
    permissions:
      contents: read
      id-token: write
    env:
      SFX_LOGIN_TEST_PTY_MODULE: ${{ github.workspace }}/deploy/staging/test-tools/node_modules/node-pty
      SFX_CI_CLIENT_BIN: ${{ github.workspace }}/.acceptance-cli/bin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      # Input provider test build only; no server/kernel rebuild or checkout in the release image.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: BPMSoftwareSolutions/sfx-providers
          ref: 86a30842f94c23f866e42eb312991c1c1f5efa88
          path: .acceptance-providers
          sparse-checkout: |
            providers/cli-login-input-provider
            providers/cli-login/Contracts.cs
            providers/cli-login/IIdentityDal.cs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Install real CLI with its hidden input helper
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $azurePython = Join-Path (Split-Path (Split-Path (Get-Command az).Source)) 'python.exe'
          if (-not (Test-Path -LiteralPath $azurePython)) { throw 'Azure CLI Python runtime unavailable' }
          "SFX_AZURE_CLI_PYTHON=$azurePython" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          npm ci --prefix deploy/staging/test-tools
          if ($LASTEXITCODE) { throw 'Acceptance tooling installation failed' }
          $providerProject = Join-Path $PWD '.acceptance-providers/providers/cli-login-input-provider/CliLoginInputProvider.csproj'
          $helper = Join-Path $env:RUNNER_TEMP 'sfx-cli/input'
          dotnet publish tools/sfx-api/login-input/LoginInput.csproj -c Release -r win-x64 --self-contained true -p:LoginInputProviderProject="$providerProject" -o "$helper"
          if ($LASTEXITCODE) { throw 'Input provider publish failed' }
          $delegate = Join-Path $env:RUNNER_TEMP 'sfx-cli/local.ps1'
          Set-Content -LiteralPath $delegate -Value "throw 'Local kernel commands are outside this remote CLI test'"
          node tools/sfx-api/install-login.mjs --endpoint 'https://sidefx-staging-fyfhb9gubneqbpaz.eastus2-01.azurewebsites.net' --input-directory "$helper" --local-launcher "$delegate" --bin "$env:SFX_CI_CLIENT_BIN" --root (Join-Path $env:RUNNER_TEMP 'sfx-cli/installed')
          if ($LASTEXITCODE) { throw 'CLI installation failed' }
      - name: Hidden terminal login, cancellation, DPAPI, whoami and revocation
        run: node deploy/staging/accept.mjs cli
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-windows-cli
          path: artifacts/staging/
          retention-days: 30
          if-no-files-found: ignore

  finish:
    needs: [deploy, windows-cli]
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.deploy.result != 'skipped'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.20.0'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: staging-release
          path: artifacts/staging
      - uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Record accepted release
        id: accepted
        if: needs.deploy.result == 'success' && needs.windows-cli.result == 'success'
        run: node deploy/staging/finish.mjs
      - name: Restore prior digest when any release gate failed
        if: always() && (needs.deploy.result != 'success' || needs.windows-cli.result != 'success' || steps.accepted.outcome == 'failure')
        run: |
          if test -f artifacts/staging/state.json; then node deploy/staging/release.mjs rollback; fi
          echo 'Release rejected; inspect acceptance and rollback receipts.' >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: staging-final
          path: |
            artifacts/staging/accepted.json
            artifacts/staging/rollback.json
          if-no-files-found: ignore
          retention-days: 90
